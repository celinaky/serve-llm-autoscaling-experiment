global
    # Access/event log at `info`. The system endpoints (/-/healthz, /-/routes)
    # tag their logs `debug` so they are dropped here but still reach the
    # rfc5424 metrics socket (level `debug`) when metrics are enabled -- mirroring
    # the proxy, which records their metric but not their access log.
    log 127.0.0.1:514 local0 info
    stats socket /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32/admin.sock mode 666 level admin expose-fd listeners
    stats timeout 30s
    maxconn 4096
    nbthread 4
    lua-load-per-thread /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32/ingress_request_router.lua
    # Routed requests buffer the body; routers see at most this much of it.
    tune.bufsize 8388608
    server-state-base /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32
    server-state-file /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32/server-state
    hard-stop-after 120s
defaults
    mode http
    option log-health-checks
    timeout connect 5s
    timeout client 3600s
    
    
    timeout http-keep-alive 90s
    
    log global
    option httplog
    option abortonclose
    option splice-request
    option splice-response
    # On a retry, use a different slot (`1`). retry-on defaults to connect
    # failures only (nothing was sent → safe to replay); override globally via
    # RAY_SERVE_HAPROXY_RETRY_ON. Inherited by every backend.
    option redispatch 1
    retry-on conn-failure
    # Set TCP_NODELAY on all connections
    option http-no-delay
    option idle-close-on-response
    # Normalize 502/503/504 to 500 per Serve's default behavior. 503
    # covers HAProxy's own "all retries exhausted / no server" response.
    errorfile 502 /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32/500.http
    errorfile 503 /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32/500.http
    errorfile 504 /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32/500.http
    load-server-state-from-file global
    balance leastconn
frontend prometheus
    bind :9101
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    no log
frontend http_frontend
    bind *:8000
    # A routed client request creates an internal routing-decision request and
    # a subsequent data-plane request. Give both backend requests the same ID.
    unique-id-format %[uuid]
    http-request set-header x-request-id %[unique-id] if !{ req.hdr(x-request-id) -m found }
    log global
    # Per-request HTTP ingress metrics. One RFC 5424 line per request matched to
    # a Serve app backend, scraped into the serve_num_http_* /
    # serve_http_request_latency_ms families (the metrics the Python proxy emits
    # in non-HAProxy mode). Goes only to the rfc5424 target below; the inherited
    # rfc3164 targets do not include the SD section, so their byte stream is
    # unchanged. The general fields come from txn.serve_* vars set per backend
    # below; %ST/%Ta/%ts render unquoted (HAProxy does not quote those aliases).
    # term_state (%ts) is HAProxy's 2-char session termination state; a leading "C"
    # means the client aborted, which the collector maps to status 499 to match the
    # Python proxy's client-disconnect convention. When ingress-request-router
    # metrics are also enabled, the router-specific fields are appended to the same
    # line.
    log /tmp/haproxy-serve/c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32/metrics.sock len 8192 format rfc5424 local1 debug
    log-format-sd "%{+Q,+E}o [serve@1 app=%[var(txn.serve_app)] route=%[var(txn.serve_route)] method=%HM status=%ST latency_ms=%Ta deployment=%[var(txn.serve_deployment)] term_state=%ts]"
    # Health check endpoint
    acl healthcheck path -i /-/healthz
    # Keep health checks out of the access log but still record their metric:
    # tag them `debug` so the access-log target (level info) drops them while the
    # metrics socket (level debug) keeps them. Mirrors the proxy, which records
    # the healthz metric with should_record_access_log=False.
    http-request set-log-level debug if healthcheck
    http-request set-var-fmt(txn.serve_route) "/-/healthz" if healthcheck
    # 200 if any backend has at least one server UP
    acl backend_http-ttft-benchmark_server_up nbsrv(http-ttft-benchmark) ge 1
    # Any backend with a server UP passes the health check (OR logic)
    http-request return status 200 content-type text/plain string "success" if healthcheck backend_http-ttft-benchmark_server_up
    http-request return status 503 content-type text/plain string "Service Unavailable" if healthcheck
    # Routes endpoint
    acl routes path -i /-/routes
    # Like health checks: kept out of the access log (tagged `debug`); its metric
    # is recorded (route=/-/routes, app unset) when metrics are enabled.
    http-request set-log-level debug if routes
    http-request set-var-fmt(txn.serve_route) "/-/routes" if routes
    http-request return status 200 content-type application/json string "{\"/\":\"ttft-benchmark\"}" if routes
    # Per-backend path ACLs (used for both ingress-request-router dispatch
    # and static use_backend selection below).
    acl is_http-ttft-benchmark path_beg /
    acl is_http-ttft-benchmark path /
    # Per-request HTTP metric vars (app / route / ingress deployment), set on the
    # first matching backend. Backends are sorted longest-prefix-first and the
    # !found guard makes the longest match win, mirroring the use_backend rules
    # below. Requests that match no app backend (e.g. /-/routes, 404s) leave
    # these unset, so the collector can skip them.
    http-request set-var-fmt(txn.serve_app) "ttft-benchmark" if is_http-ttft-benchmark !{ var(txn.serve_app) -m found }
    http-request set-var-fmt(txn.serve_route) "/" if is_http-ttft-benchmark !{ var(txn.serve_route) -m found }
    http-request set-var-fmt(txn.serve_deployment) "LLMServer:Qwen--Qwen3_6-27B-FP8" if is_http-ttft-benchmark !{ var(txn.serve_deployment) -m found }
    # Set txn.ingress_request_router_app to the first matching router-bearing
    # backend. Backends are sorted longest-prefix-first, and the !found guard
    # ensures only the longest match wins.
    http-request set-var(txn.ingress_request_router_app) str(http-ttft-benchmark) if is_http-ttft-benchmark !{ var(txn.ingress_request_router_app) -m found }
    acl has_ingress_request_router_app var(txn.ingress_request_router_app) -m found
    # Save the multiplexed model ID before removing untrusted client routing
    # metadata. Prefer the canonical underscore spelling when both are sent.
    http-request set-var-fmt(txn.multiplexed_model_id) %[req.hdr(serve_multiplexed_model_id)] if { req.hdr(serve_multiplexed_model_id) -m found } has_ingress_request_router_app
    http-request set-var-fmt(txn.multiplexed_model_id) %[req.hdr(serve-multiplexed-model-id)] if { req.hdr(serve-multiplexed-model-id) -m found } !{ var(txn.multiplexed_model_id) -m found } has_ingress_request_router_app
    # Remove client-supplied values from the router-owned header namespace.
    # Lua then applies trusted metadata returned by /internal/route.
    http-request del-header x-serve-router- -m beg if has_ingress_request_router_app
    http-request del-header serve_multiplexed_model_id if has_ingress_request_router_app
    http-request del-header serve-multiplexed-model-id if has_ingress_request_router_app
    http-request wait-for-body time 5s if has_ingress_request_router_app
    http-request lua.route_via_ingress_request_router if has_ingress_request_router_app
    # Fall back to primary replicas when the ingress router fails.
    http-request set-var(txn.ingress_request_router_recoverable) str(1) if { var(txn.ingress_request_router_app) -m str "http-ttft-benchmark" } { var(txn.ingress_request_router_failed) -m found }
    http-request set-var(txn.ingress_request_router_fallback) str(1) if { var(txn.ingress_request_router_app) -m str "http-ttft-benchmark" } { var(txn.ingress_request_router_failed) -m found }
    # A pin-miss can also use the fallback Serve proxy.
    http-request set-var(txn.ingress_request_router_recoverable) str(1) if { var(txn.ingress_request_router_app) -m str "http-ttft-benchmark" } { var(txn.ingress_request_router_failed) -m str "unknown_replica_id" }
    # Return 503 on unrecoverable router failures before the use_backend rules.
    http-request return status 503 content-type text/plain lf-string "Ingress request router failed: %[var(txn.ingress_request_router_failed)]" hdr X-Serve-Reason %[var(txn.ingress_request_router_failed)] if { var(txn.ingress_request_router_failed) -m found } !{ var(txn.ingress_request_router_recoverable) -m found }
    # Static routing based on path prefixes in decreasing length then alphabetical order
    use_backend http-ttft-benchmark-via-ingress-request-router if is_http-ttft-benchmark { var(txn.via_ingress_request_router) -m found }
    # Pin-miss recovery: route into the router backend, which picks the fallback.
    use_backend http-ttft-benchmark-via-ingress-request-router if is_http-ttft-benchmark { var(txn.ingress_request_router_failed) -m str "unknown_replica_id" }
    use_backend http-ttft-benchmark if is_http-ttft-benchmark
    default_backend default_backend
backend default_backend
    http-request return status 404 content-type text/plain lf-string "Path '%[path]' not found. Ping http://.../-/routes for available routes."
backend http-ttft-benchmark
    log global
    balance random(1)
    # Enable HTTP connection reuse for better performance
    http-reuse always
    # Set backend-specific timeouts, overriding defaults if specified
    # Set timeouts to support keep-alive connections
    # Health check configuration - use backend-specific or global defaults
    # HTTP health check with custom path
    option httpchk GET /-/healthz
    http-check expect status 200
    default-server fastinter 250ms downinter 250ms fall 2 rise 2 inter 5s check
    # Servers in this backend
    server SERVE_REPLICA_ttft-benchmark-LLMServer_Qwen--Qwen3_6-27B-FP8-2a1fmw2i 127.0.0.1:30001 check observe layer4 error-limit 3 on-error mark-down
    # Fallback to head node's Serve proxy when no ingress replicas are available
    server SERVE_PROXY_ACTOR-fallback-c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32 127.0.0.1:8500 check backup
backend http-ttft-benchmark-via-ingress-request-router
    log global
    balance random(1)
    # Keep the pinned data-plane path on the same connection policy as the
    # primary backend. For streamed responses, forcing server-close can leave
    # HAProxy holding unread server-side FINs under a burst while worker
    # threads are still routing other requests.
    http-reuse always
    # Inherits the defaults block's `option redispatch 1` + retry-on, so a
    # DOWN/slow pinned server falls through to a different replica instead of
    # head-of-line-blocking on the original pick. One retry policy everywhere.
    use-server SERVE_REPLICA_ttft-benchmark-LLMServer_Qwen--Qwen3_6-27B-FP8-2a1fmw2i if { var(txn.ingress_request_router_target) -m str "SERVE_REPLICA_ttft-benchmark-LLMServer_Qwen--Qwen3_6-27B-FP8-2a1fmw2i" }
    # Pin-miss: route to the fallback Serve proxy, which re-pins via its own
    # router. If the fallback is DOWN this use-server is skipped and the request
    # load-balances onto a primary replica in this backend, so affinity lapses
    # until the fallback's health check passes. That is plain selection-time
    # fallthrough, not `option redispatch` (which only re-picks after a
    # connection failure to an already-selected server).
    use-server SERVE_PROXY_ACTOR-fallback-c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32 if { var(txn.ingress_request_router_failed) -m str "unknown_replica_id" }
    # `track` allows us to mirror primary-backend health and avoid double-checking.
    server SERVE_REPLICA_ttft-benchmark-LLMServer_Qwen--Qwen3_6-27B-FP8-2a1fmw2i 127.0.0.1:30001 track http-ttft-benchmark/SERVE_REPLICA_ttft-benchmark-LLMServer_Qwen--Qwen3_6-27B-FP8-2a1fmw2i
    server SERVE_PROXY_ACTOR-fallback-c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32 127.0.0.1:8500 track http-ttft-benchmark/SERVE_PROXY_ACTOR-fallback-c7e54ddf3e8987340282a5b7bdf244d27c8912f06b3540e3efa17c32 backup
listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 1s
