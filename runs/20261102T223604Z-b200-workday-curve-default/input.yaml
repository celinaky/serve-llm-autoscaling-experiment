# Ray Serve's default autoscaling policy (ongoing requests per replica) on
# the same workday curve as b200_workday_curve_prefill_mean.yaml: ramp 1->32
# sessions at one cold session every 30s (0-930s), hold at 32 for 930s
# (930-1860s), no ramp down. Same seed, same KV-aware routing with session
# pinning, same Serve delays (upscale 40s, downscale 1800s so nothing is
# removed during the run).
#
# Policy: Serve's built-in rule, replicas = ceil(ongoing requests /
# target_ongoing_requests), where ongoing requests is the 60s look-back
# average of in-flight requests. It knows nothing about prompt size: a 665
# token turn and a 150K cold prompt count the same. Each AgentX session has
# at most one request in flight, so the signal is roughly the number of
# active sessions, and the target of 8 means 4 replicas once all 32 are
# live.
#
# Compare against runs/20261102T203807Z-* (mean token policy, 3 replicas,
# 11/16 windows) with the same tools: python tools/load_breakdown.py <run>
# && python tools/arrival_load_windows.py <run> --per-requests 100
#
# Timeline: load 0-1860s, AIPerf drains for up to 120s, then 180s idle.
name: b200-workday-curve-default
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 1024
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    policy:
      name: default
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 8
    # The default policy's signal: ongoing requests per replica. Each AgentX
    # session has at most one request in flight, so ongoing requests track
    # active sessions; 32 sessions / 8 = 4 replicas at the hold.
    target_ongoing_requests: 8
    # Same delays as the mean-policy run: 40s of asking for more before a
    # replica is added, and no scale-down during the run.
    upscale_delay_s: 40
    downscale_delay_s: 1800
    metrics_interval_s: 2
    look_back_period_s: 60
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 1860
  grace_period_s: 120
  post_load_observation_s: 180
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 32
    # 0-930s ramp 1->32 (one cold session every 30s); 930-1860s hold at 32.
    # No ramp down: load issuance ends at 1860s and AIPerf drains.
    concurrency_series:
      - {time_s: 0, sessions: 1}
      - {time_s: 930, sessions: 32}
      - {time_s: 1860, sessions: 32}
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 42
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  # The workday-curve AIPerf fork, pinned to a commit.
  aiperf_source: git+https://github.com/celinaky/aiperf@1c61dfbb7644b26c70ce21163f0b4cda893438b0
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  ttft_slo_ms: 5000
  itl_slo_ms: 50
  # Score the whole curve; there is no single steady state.
  warmup_s: 0
