# Run from the standalone profiler folder:
# python -m serve_profiler run examples/h100.yaml
deployment:
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: H100
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 512
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    enable_prompt_tokens_details: true
    kv_cache_dtype: fp8
    language_model_only: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  readiness_timeout_s: 1800
  # Optional: override the default sibling ../aiperf checkout with a published revision.
