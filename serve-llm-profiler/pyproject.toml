[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serve-llm-profiler"
version = "0.1.0"
description = "Offline prefill queue calibration for a Ray Serve LLM application"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "requests>=2", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
serve-profiler = "serve_profiler.__main__:main"

[tool.setuptools.packages.find]
include = ["serve_profiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
