name: qwen-agentx-slo-baseline

# Calibrates a TTFT SLO: one fixed replica serving 8 concurrent AgentX
# session trees for the full 900s scenario minimum. The deployment matches
# agentx_kv_aware_autoscaling.yaml except that it cannot scale.
#
# The run writes analysis/slo_calibration.json; copy its
# recommended_ttft_slo_ms (the p90 TTFT of successful profiling requests)
# into analysis.ttft_slo_ms of the autoscaling experiment. This config sets
# no ttft_slo_ms because it produces one.
#
# Hardware: one >=80GB GPU of any type (no accelerator_type is pinned).
# Requires ai-dynamo>=1.4.0 for KV-aware routing, which the harness checks
# before deploying.
#
# Timeline: load 0-900s, then AIPerf drains for up to 300s.

deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    # AgentX prompts reach 256K tokens; a truncated body falls back to
    # load-balanced routing.
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 1024
    max_num_batched_tokens: 65536
    enable_prefix_caching: true
    kv_cache_dtype: fp8
  autoscaling:
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 1
benchmark:
  generator: aiperf
  mode: agentx_fixed_concurrency
  duration_s: 900
  grace_period_s: 300
  post_load_observation_s: 0
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    # Session trees, not HTTP requests: subagents can put more requests in
    # flight than this.
    target_concurrency: 8
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 42
    unsafe_override: false
  streaming: true
  fail_fast: true
  use_server_token_count: true

runtime:
  endpoint_url: http://127.0.0.1:8000
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs

analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
