# H100s, 32 sessions, Mooncake shared KV, FIFO prefill estimate decay 10k tokens/sec/replica.
# Target concurrency adds one slot each30s (controller polling tolerance).
# 930s ramp up,2790s hold,930s ramp down;40s upscale/250s downscale.
# Paired points avoid nearest-integer interpolation adding slots15s early.
name: h100-32-sessions-mooncake-decay-10k-scale-down-250s
