# Serve's default (ongoing-request) policy on the same workday curve as
# b200_workday_curve_token.yaml; everything but the policy block is identical.
#
# A workday-shaped AgentX session curve on 8 B200s: a slow start, a morning
# surge of cold sessions, a hold, and a slow decline, all in one AIPerf
# process. The curve is delivered by the workday-curve AIPerf fork
# (runtime.aiperf_source): the session limit follows the curve, and when it
# falls below the live count, sessions are retired at their next turn
# boundary. Every session starts cold at turn 0. Compare the AIPerf log's
# "live sessions" count at each limit change, and the session-trees line on
# the traffic panel, against the configured curve.
#
# Timeline: load 0-1200s, AIPerf drains for up to 120s, then 180s idle.
name: b200-workday-curve-default
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 1024
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    policy:
      name: default
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 8
    target_ongoing_requests: 8
    upscale_delay_s: 10
    downscale_delay_s: 120
    metrics_interval_s: 2
    look_back_period_s: 20
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 1200
  grace_period_s: 120
  post_load_observation_s: 180
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 60
    # 0-120s slow start (one cold session every ~13s); 120-270s surge, 50
    # cold sessions in 150s (one every 3s, ~30K cold tokens/s, more than one
    # B200's ~16-20K tok/s of prefill), so a prefill backlog persists long
    # enough to survive the policy's lookback mean; 270-600s hold at 60;
    # 600-1200s slow decline, one retirement every ~10s. 60 sessions is about
    # four replicas' worth, so the 8-replica cap is never the limit. The floor
    # is 1 because the series cannot go to 0, and load issuance ends at 1200s.
    concurrency_series:
      - {time_s: 0, sessions: 1}
      - {time_s: 120, sessions: 10}
      - {time_s: 270, sessions: 60}
      - {time_s: 600, sessions: 60}
      - {time_s: 1200, sessions: 1}
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 42
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  # The workday-curve AIPerf fork, pinned to a commit.
  aiperf_source: git+https://github.com/celinaky/aiperf@1c61dfbb7644b26c70ce21163f0b4cda893438b0
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  ttft_slo_ms: 5000
  itl_slo_ms: 50
  # Score the whole curve; there is no single steady state.
  warmup_s: 0
