# The SLA policy in advisory mode under the workday ramp of
# b200_workday_ramp_sla.yaml: Serve scales exactly as the default policy
# does while the SLA policy reports what it would have done. One run gives
# the baseline's scaling and, at every scrape, the SLA recommendation, model
# readiness and prediction error on the same traffic.
name: b200-workday-ramp-sla-advisory
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 1024
    max_num_batched_tokens: 65536
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    policy:
      name: sla
      kwargs:
        ttft_ms: 3000
        itl_ms: 50
        advisory: true
    upscaling_factor: 1.0
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 4
    target_ongoing_requests: 8
    upscale_delay_s: 10
    downscale_delay_s: 60
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 3000
  grace_period_s: 120
  post_load_observation_s: 300
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 48
    concurrency_ramp_duration_s: 2400
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 1
    seed: 42
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
