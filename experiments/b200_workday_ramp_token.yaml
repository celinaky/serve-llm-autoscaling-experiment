# The token autoscaling policy (celina/prefill-token-autoscaling-policy)
# under a workday-shaped AgentX ramp on 4 B200s.
#
# The policy reads the KV-aware router's work snapshot (outstanding
# effective prefill tokens, i.e. tokens not served by the prefix cache, and
# active decode requests) and asks for
#   max(ceil(prefill_tokens / target_prefill_tokens_per_replica),
#       ceil(decode_requests / target_decode_requests_per_replica), 1)
# replicas. Starting targets, from findings-claude-code-overnight/
# b200_investigation.md: a B200 replica prefills ~20K cold tokens/s, so
# 60K outstanding tokens per replica is ~3s of prefill backlog, and it is
# comfortable at ~16 concurrent sessions, which is roughly the number of
# requests decoding at once.
#
# Load: sessions ramp 1 -> 48 over 40 minutes, then hold for 10. One
# replica handles ~16 sessions, so the ramp crosses a replica's capacity at
# ~16 sessions (t ~ 800s) and ~32 (t ~ 1600s) and leans on the fourth GPU at
# the top. Sessions start at random points in their traces (trajectory start
# 0/1) so the ramp is the only transient; the step to zero load plus the idle
# observation is the scale-down test.
#
# Timeline: load 0-3000s, AIPerf drains for up to 120s, then 300s idle.
name: b200-workday-ramp-token
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 32
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    policy:
      name: token
      kwargs:
        target_prefill_tokens_per_replica: 60000
        target_decode_requests_per_replica: 16
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 4
    # Unused by the token policy; kept so the deployment config stays
    # comparable with the default-policy run.
    target_ongoing_requests: 8
    upscale_delay_s: 10
    # A replica costs ~100s to start; do not drop one on a short lull.
    downscale_delay_s: 300
  max_ongoing_requests: 128
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 3000
  grace_period_s: 120
  post_load_observation_s: 300
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 48
    concurrency_ramp_duration_s: 2400
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 1
    seed: 42
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  ttft_slo_ms: 3000
