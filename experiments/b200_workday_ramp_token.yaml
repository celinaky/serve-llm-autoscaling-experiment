name: b200-workday-ramp-token
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 1024
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    policy:
      name: token
      kwargs:
        target_prefill_tokens_per_replica: 60000
        target_decode_requests_per_replica: 8
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 8
    # Unused by the token policy; kept so the deployment config stays
    # comparable with the default-policy run.
    target_ongoing_requests: 8
    # 0: the prefill backlog is a spike train (a cold prompt clears in 5-15s),
    # so any persistence requirement silences the prefill term; the 300s
    # downscale delay is what prevents flapping.
    upscale_delay_s: 0
    # A replica costs ~100s to start; do not drop one on a short lull.
    downscale_delay_s: 300
    # The engine replica records the router's work snapshot every
    # min(0.2 x look_back_period_s, metrics_interval_s) and pushes it to the
    # controller every metrics_interval_s: 6s and 10s by default, against
    # backlog spikes that last 2-8s. Record and push every 2s instead, so the
    # policy reacts to a cold prompt within seconds (first scale-up at ~10s
    # into the ramp rather than ~50s).
    metrics_interval_s: 2
    look_back_period_s: 10
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 900
  grace_period_s: 120
  post_load_observation_s: 180
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 32
    # One cold session start every ~19s; 32 sessions is two replicas' worth.
    concurrency_ramp_duration_s: 600
    # Every session begins at turn 0: its first request is a cold prompt.
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 42
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  # The p95 of the workload's queue-free TTFT floor is ~3.8s (cold prompts of
  # 32K-128K uncached tokens at ~16K tok/s; findings-token-policy/scripts/
  # ttft_floor.py), so 3s is unreachable by any replica count. The best
  # configuration measured 4.5-4.9s over three runs; 5s is the target it
  # meets with the run-to-run spread included.
  ttft_slo_ms: 5000
  itl_slo_ms: 50
  # Score the whole ramp; the cold session starts are the point.
  warmup_s: 0
