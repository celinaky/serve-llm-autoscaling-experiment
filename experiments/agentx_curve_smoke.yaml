# Validation run for the concurrency-series machinery: 15 minutes, 1 -> 16
# -> 4 -> 12 sessions on the b200_workday_curve deployment. Check that the
# AIPerf log's "session limit set to" lines follow the curve, that the live
# session trees line on the traffic panel falls within about one turn gap of
# the configured curve on the way down, and that lanes are re-admitted on the
# final rise. Below the AgentX scenario's 900s minimum, so not a valid
# submission.
name: agentx-curve-smoke
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 1024
    max_num_batched_tokens: 65536
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    policy:
      name: default
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 4
    target_ongoing_requests: 8
    upscale_delay_s: 0
    downscale_delay_s: 300
    metrics_interval_s: 2
    look_back_period_s: 10
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 900
  grace_period_s: 120
  post_load_observation_s: 60
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 16
    concurrency_series:
      - {time_s: 0, sessions: 1}
      - {time_s: 300, sessions: 16}
      - {time_s: 600, sessions: 4}
      - {time_s: 900, sessions: 12}
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 42
    unsafe_override: true
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  aiperf_source: git+https://github.com/celinaky/aiperf@1c61dfbb7644b26c70ce21163f0b4cda893438b0
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  ttft_slo_ms: 5000
  itl_slo_ms: 50
  warmup_s: 0
