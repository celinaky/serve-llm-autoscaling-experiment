# Twenty-minute fixed-replica comparison: native learner + independent scheduler tracing.
name: h100-online-queue-profile-traced-short
deployment:
  application_name: online-queue-traced-profile
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: H100
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
    request_router_kwargs:
      enable_prefill_queue_learning: true
      calibration_min_samples: 100
      calibration_window_samples: 1000
      calibration_refresh_interval_s: 120
      prefill_decay_tokens_per_second: 0
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 512
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    kv_offloading_backend: native
    kv_offloading_size: 64
    kv_cache_dtype: fp8
    language_model_only: true
    disable_log_stats: false
  autoscaling:
    policy:
      name: token
      kwargs:
        upscale_lookback_s: 60
        upscale_aggregation: mean
        target_queue_time_ms: 1000
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 1
    target_ongoing_requests: 8
    upscale_delay_s: 40
    downscale_delay_s: 86400
    metrics_interval_s: 2
    look_back_period_s: 60
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 1200
  grace_period_s: 300
  post_load_observation_s: 60
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 16
    concurrency_series:
    - time_s: 0
      sessions: 1
    - time_s: 20
      sessions: 4
    - time_s: 180
      sessions: 4
    - time_s: 200
      sessions: 8
    - time_s: 360
      sessions: 8
    - time_s: 380
      sessions: 12
    - time_s: 540
      sessions: 12
    - time_s: 560
      sessions: 6
    - time_s: 720
      sessions: 6
    - time_s: 740
      sessions: 16
    - time_s: 900
      sessions: 16
    - time_s: 920
      sessions: 4
    - time_s: 1080
      sessions: 4
    - time_s: 1100
      sessions: 8
    - time_s: 1200
      sessions: 8
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 48
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  aiperf_source: git+https://github.com/celinaky/aiperf@1c61dfbb7644b26c70ce21163f0b4cda893438b0
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: /home/ray/default/online-prefill-harness/runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  ttft_slo_ms: 5000
  itl_slo_ms: 50
  warmup_s: 0
  prefill_calibration_trace_dir: /mnt/cluster_storage/serve-llm-autoscaling-experiment/online-prefill-calibration
