# The default (ongoing-request) autoscaling policy under the workday ramp of
# b200_workday_ramp_token.yaml: the baseline it is compared against, scored
# on the same SLO. The policy has one knob, target_ongoing_requests; a run
# at 6 and at 12 beside this one gives the baseline's attainment-vs-cost
# frontier rather than a single point.
name: b200-workday-ramp-default
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 32
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 4
    target_ongoing_requests: 8
    upscale_delay_s: 10
    downscale_delay_s: 60
  max_ongoing_requests: 128
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 900
  grace_period_s: 120
  post_load_observation_s: 180
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 32
    # One cold session start every ~19s; 32 sessions is two replicas' worth.
    concurrency_ramp_duration_s: 600
    # Every session begins at turn 0: its first request is a cold prompt.
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 42
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  # The p95 of the workload's queue-free TTFT floor is ~3.8s (cold prompts of
  # 32K-128K uncached tokens at ~16K tok/s; findings-token-policy/scripts/
  # ttft_floor.py), so 3s is unreachable by any replica count. 4.5s leaves
  # ~0.7s for the queueing an autoscaler can remove.
  ttft_slo_ms: 4500
  itl_slo_ms: 50
  # Score the whole ramp; the cold session starts are the point.
  warmup_s: 0
