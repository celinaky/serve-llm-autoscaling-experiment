# A workday-shaped AgentX session curve on 4 B200s: sessions rise through
# the morning, dip at lunch, peak in the afternoon and wind down, all in one
# AIPerf process. The curve is delivered by the workday-curve AIPerf fork
# (runtime.aiperf_source): the session limit follows the curve, and when it
# falls below the live count, sessions are retired at their next turn
# boundary. Every session starts cold at turn 0. Compare the AIPerf log's
# "live sessions" count at each limit change, and the session-trees line on
# the traffic panel, against the configured curve.
#
# Timeline: load 0-5400s, AIPerf drains for up to 120s, then 180s idle.
name: b200-workday-curve-token
deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3.6-27B-FP8
  accelerator_type: B200
  route_prefix: /
  routing:
    policy: kv_aware
    direct_streaming: true
    forward_request_body: true
    haproxy_request_buffer_bytes: 8388608
  engine:
    tensor_parallel_size: 1
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    max_num_seqs: 32
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    kv_cache_dtype: fp8
    language_model_only: true
  autoscaling:
    policy:
      name: token
      kwargs:
        target_prefill_tokens_per_replica: 60000
        target_decode_requests_per_replica: 8
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 4
    target_ongoing_requests: 8
    upscale_delay_s: 0
    downscale_delay_s: 300
    metrics_interval_s: 2
    look_back_period_s: 10
  max_ongoing_requests: 128
benchmark:
  generator: aiperf
  mode: agentx_concurrency_ramp
  duration_s: 5400
  grace_period_s: 120
  post_load_observation_s: 180
  workload:
    type: agentx
    public_dataset: semianalysis_cc_traces_weka_062126_256k
    target_concurrency: 40
    # Minutes: 0-20 morning ramp, 20-35 steady, 35-45 lunch dip and return,
    # 45-60 afternoon peak, 60-90 wind-down to a few stragglers.
    concurrency_series:
      - {time_s: 0, sessions: 1}
      - {time_s: 1200, sessions: 32}
      - {time_s: 2100, sessions: 32}
      - {time_s: 2400, sessions: 16}
      - {time_s: 2700, sessions: 32}
      - {time_s: 3000, sessions: 40}
      - {time_s: 3600, sessions: 40}
      - {time_s: 5400, sessions: 4}
    trajectory_start_min_ratio: 0
    trajectory_start_max_ratio: 0
    seed: 42
  streaming: true
  fail_fast: true
runtime:
  endpoint_url: http://127.0.0.1:8000
  # The workday-curve AIPerf fork, pinned to a commit.
  aiperf_source: git+https://github.com/celinaky/aiperf@3bd607a44b8358a021bdeabab1ac02f82c86bfa3
  readiness_timeout_s: 1800
  keep_deployment: false
  results_dir: runs
analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
  ttft_slo_ms: 5000
  itl_slo_ms: 50
  # Score the whole curve; there is no single steady state.
  warmup_s: 0
